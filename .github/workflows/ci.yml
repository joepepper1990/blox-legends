# Every push: unit tests + browser tests. Pushes to main also publish the
# built game to GitHub Pages, but only if every test passed.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (generators, checkers, learner, scheduler, simulations, saves, backups)
        run: npm test
      - name: Content validation (checkers, fit, curriculum, capacity over 90 simulated days)
        run: node tools/validate-content.mjs
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests (boot, play, save, backup/restore, v1 import, offline, updates)
        run: npm run e2e

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the site (versioned service worker included)
        run: node tools/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  # After every deploy, play the published game in a real browser.
  live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke-test the published game (waits for this build to be live)
        run: |
          node tools/build.mjs
          export EXPECT_VERSION=$(node -p "require('./_site/version.json').version")
          export BASE_URL="${{ needs.deploy.outputs.page_url }}"
          npm run e2e:live
